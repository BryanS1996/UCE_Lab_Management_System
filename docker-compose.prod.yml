# Production Deployment — Docker Hub Images
# Deploy en AWS EC2 con docker-compose pull + docker-compose up
# Variables requeridas: .env (DATABASE_HOSTS, SECRETS, RABBITMQ_URL)

services:

  auth-service:
    image: ${ECR_REGISTRY:-bryanfabricio96}/uce-auth-service:latest
    container_name: auth-service
    pull_policy: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: ${AUTH_DB_HOST}
      DB_PORT: 5432
      DB_USERNAME: ${AUTH_DB_USER}
      DB_PASSWORD: ${AUTH_DB_PASS}
      DB_NAME: auth_service
      DB_SSL: "true"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      - auth-db
    networks:
      - uce-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  reservation-service:
    image: ${ECR_REGISTRY:-bryanfabricio96}/uce-reservation-service:latest
    container_name: reservation-service
    pull_policy: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: ${RESERVATION_DB_HOST}
      DB_PORT: 5432
      DB_USERNAME: ${RESERVATION_DB_USER}
      DB_PASSWORD: ${RESERVATION_DB_PASS}
      DB_NAME: reservation_service
      DB_SSL: "true"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      - reservation-db
      - rabbitmq
    networks:
      - uce-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  laboratory-service:
    image: ${ECR_REGISTRY:-bryanfabricio96}/uce-laboratory-service:latest
    container_name: laboratory-service
    pull_policy: always
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: ${LAB_DB_HOST}
      DB_PORT: 5432
      DB_USERNAME: ${LAB_DB_USER}
      DB_PASSWORD: ${LAB_DB_PASS}
      DB_NAME: laboratory_service
      DB_SSL: "true"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      - laboratory-db
      - rabbitmq
    networks:
      - uce-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  notification-service:
    image: ${ECR_REGISTRY:-bryanfabricio96}/uce-notification-service:latest
    container_name: notification-service
    pull_policy: always
    environment:
      NODE_ENV: production
      PORT: 3003
      DB_HOST: ${NOTIF_DB_HOST}
      DB_PORT: 5432
      DB_USERNAME: ${NOTIF_DB_USER}
      DB_PASSWORD: ${NOTIF_DB_PASS}
      DB_NAME: notification_service
      DB_SSL: "true"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      - notification-db
      - rabbitmq
    networks:
      - uce-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Production: API Gateway ─────────────────────────────
  api-gateway:
    image: ${ECR_REGISTRY:-bryanfabricio96}/uce-api-gateway:latest
    container_name: api-gateway
    pull_policy: always
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3000
      RESERVATION_SERVICE_URL: http://reservation-service:3001
      LABORATORY_SERVICE_URL: http://laboratory-service:3002
      NOTIFICATION_SERVICE_URL: http://notification-service:3003
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - reservation-service
      - laboratory-service
      - notification-service
    networks:
      - uce-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Production: Frontend ─────────────────────────────────
  frontend:
    image: ${ECR_REGISTRY:-bryanfabricio96}/uce-frontend:latest
    container_name: frontend
    pull_policy: always
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - uce-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health.html"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ─── Production: Databases ─────────────────────────────────
  auth-db:
    image: postgres:15-alpine
    container_name: auth-db
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS}
      POSTGRES_DB: auth_service
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - uce-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  reservation-db:
    image: postgres:15-alpine
    container_name: reservation-db
    environment:
      POSTGRES_USER: ${RESERVATION_DB_USER}
      POSTGRES_PASSWORD: ${RESERVATION_DB_PASS}
      POSTGRES_DB: reservation_service
    volumes:
      - reservation-db-data:/var/lib/postgresql/data
    networks:
      - uce-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESERVATION_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  laboratory-db:
    image: postgres:15-alpine
    container_name: laboratory-db
    environment:
      POSTGRES_USER: ${LAB_DB_USER}
      POSTGRES_PASSWORD: ${LAB_DB_PASS}
      POSTGRES_DB: laboratory_service
    volumes:
      - laboratory-db-data:/var/lib/postgresql/data
      - ./db-init/init-laboratories.sql:/docker-entrypoint-initdb.d/init-laboratories.sql
    networks:
      - uce-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LAB_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:15-alpine
    container_name: notification-db
    environment:
      POSTGRES_USER: ${NOTIF_DB_USER}
      POSTGRES_PASSWORD: ${NOTIF_DB_PASS}
      POSTGRES_DB: notification_service
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    networks:
      - uce-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIF_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Production: RabbitMQ ─────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - uce-prod-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  auth-db-data:
  reservation-db-data:
  laboratory-db-data:
  notification-db-data:
  rabbitmq-data:

networks:
  uce-prod-network:
    driver: bridge
