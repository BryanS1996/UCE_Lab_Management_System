# Production Deployment — ECR Images
# Variables requeridas: /home/ec2-user/app/.env (escrito por deploy-prod.yml desde PROD_ENV_FILE secret)
# Ejecutar: docker compose -f docker-compose.prod.yml up -d

services:

  auth-service:
    image: ${ECR_REGISTRY:-localhost}/uce-auth-service:${IMAGE_TAG:-latest}
    container_name: auth-service
    pull_policy: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: ${AUTH_DB_HOST}
      DB_PORT: 5432
      DB_USERNAME: ${AUTH_DB_USER}
      DB_PASSWORD: ${AUTH_DB_PASS}
      DB_NAME: auth_service
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - uce-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  reservation-service:
    image: ${ECR_REGISTRY:-localhost}/uce-reservation-service:${IMAGE_TAG:-latest}
    container_name: reservation-service
    pull_policy: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: ${RESERVATION_DB_HOST}
      DB_PORT: 5432
      DB_USERNAME: ${RESERVATION_DB_USER}
      DB_PASSWORD: ${RESERVATION_DB_PASS}
      DB_NAME: reservation_service
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RABBITMQ_URL: ${RABBITMQ_URL}
      KAFKA_BROKERS: kafka-prod:29092
    depends_on:
      reservation-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka-prod:
        condition: service_started
    networks:
      - uce-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  laboratory-service:
    image: ${ECR_REGISTRY:-localhost}/uce-laboratory-service:${IMAGE_TAG:-latest}
    container_name: laboratory-service
    pull_policy: always
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: ${LAB_DB_HOST}
      DB_PORT: 5432
      DB_USERNAME: ${LAB_DB_USER}
      DB_PASSWORD: ${LAB_DB_PASS}
      DB_NAME: laboratory_service
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RABBITMQ_URL: ${RABBITMQ_URL}
      MQTT_URL: mqtt://mosquitto:1883
    depends_on:
      laboratory-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - uce-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  notification-service:
    image: ${ECR_REGISTRY:-localhost}/uce-notification-service:${IMAGE_TAG:-latest}
    container_name: notification-service
    pull_policy: always
    environment:
      NODE_ENV: production
      PORT: 3003
      DB_HOST: ${NOTIF_DB_HOST}
      DB_PORT: 5432
      DB_USERNAME: ${NOTIF_DB_USER}
      DB_PASSWORD: ${NOTIF_DB_PASS}
      DB_NAME: notification_service
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RABBITMQ_URL: ${RABBITMQ_URL}
      KAFKA_BROKERS: kafka-prod:29092
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MQTT_URL: mqtt://mosquitto:1883
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka-prod:
        condition: service_started
    networks:
      - uce-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  catalog-service:
    image: ${ECR_REGISTRY:-localhost}/uce-catalog-service:${IMAGE_TAG:-latest}
    container_name: catalog-service
    pull_policy: always
    environment:
      NODE_ENV: production
      PORT: 3004
      DB_HOST: ${CATALOG_DB_HOST}
      DB_PORT: 5432
      DB_USERNAME: ${CATALOG_DB_USER}
      DB_PASSWORD: ${CATALOG_DB_PASS}
      DB_NAME: catalog_service
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RABBITMQ_URL: ${RABBITMQ_URL}
      MQTT_URL: mqtt://mosquitto:1883
    depends_on:
      catalog-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - uce-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Production: API Gateway ──────────────────────────────────────────────
  api-gateway:
    image: ${ECR_REGISTRY:-localhost}/uce-api-gateway:${IMAGE_TAG:-latest}
    container_name: api-gateway
    pull_policy: always
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3000
      RESERVATION_SERVICE_URL: http://reservation-service:3001
      LABORATORY_SERVICE_URL: http://laboratory-service:3002
      NOTIFICATION_SERVICE_URL: http://notification-service:3003
      CATALOG_SERVICE_URL: http://catalog-service:3004
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      reservation-service:
        condition: service_healthy
      laboratory-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    networks:
      - uce-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── Production: Frontend ─────────────────────────────────────────────────
  frontend:
    image: ${ECR_REGISTRY:-localhost}/uce-frontend:${IMAGE_TAG:-latest}
    container_name: frontend
    pull_policy: always
    ports:
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - uce-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health.html"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ─── Production: Databases ────────────────────────────────────────────────
  auth-db:
    image: postgres:15-alpine
    container_name: auth-db
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS}
      POSTGRES_DB: auth_service
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - uce-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  reservation-db:
    image: postgres:15-alpine
    container_name: reservation-db
    environment:
      POSTGRES_USER: ${RESERVATION_DB_USER}
      POSTGRES_PASSWORD: ${RESERVATION_DB_PASS}
      POSTGRES_DB: reservation_service
    volumes:
      - reservation-db-data:/var/lib/postgresql/data
    networks:
      - uce-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RESERVATION_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  laboratory-db:
    image: postgres:15-alpine
    container_name: laboratory-db
    environment:
      POSTGRES_USER: ${LAB_DB_USER}
      POSTGRES_PASSWORD: ${LAB_DB_PASS}
      POSTGRES_DB: laboratory_service
    volumes:
      - laboratory-db-data:/var/lib/postgresql/data
      - ./db-init/init-laboratories.sql:/docker-entrypoint-initdb.d/init-laboratories.sql
    networks:
      - uce-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LAB_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:15-alpine
    container_name: notification-db
    environment:
      POSTGRES_USER: ${NOTIF_DB_USER}
      POSTGRES_PASSWORD: ${NOTIF_DB_PASS}
      POSTGRES_DB: notification_service
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    networks:
      - uce-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIF_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog-db:
    image: postgres:15-alpine
    container_name: catalog-db
    environment:
      POSTGRES_USER: ${CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASS}
      POSTGRES_DB: catalog_service
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    networks:
      - uce-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Production: RabbitMQ ─────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - uce-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Production: Zookeeper ────────────────────────────────────────────────
  zookeeper-prod:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper-prod
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - uce-prod-network
    restart: unless-stopped

  # ─── Production: MQTT Broker (Eclipse Mosquitto) ──────────────────────────
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    networks:
      - uce-prod-network
    command: >
      sh -c "echo 'listener 1883' > /mosquitto/config/mosquitto.conf && 
      echo 'protocol mqtt' >> /mosquitto/config/mosquitto.conf &&
      echo 'listener 9001' >> /mosquitto/config/mosquitto.conf &&
      echo 'protocol websockets' >> /mosquitto/config/mosquitto.conf &&
      echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf && 
      /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"
    restart: unless-stopped

  # ─── Production: Kafka Broker ─────────────────────────────────────────────
  kafka-prod:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-prod
    ports:
      - "9094:9092"
    depends_on:
      - zookeeper-prod
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-prod:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-prod:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - uce-prod-network
    restart: unless-stopped

volumes:
  auth-db-data:
  reservation-db-data:
  laboratory-db-data:
  notification-db-data:
  catalog-db-data:
  rabbitmq-data:

networks:
  uce-prod-network:
    driver: bridge
