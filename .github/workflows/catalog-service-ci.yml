name: Catalog Service — CI

on:
  push:
    paths:
      - 'services/catalog-service/**'
      - '.github/workflows/_service-ci.yml'
  pull_request:
    paths:
      - 'services/catalog-service/**'
      - '.github/workflows/_service-ci.yml'
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service-name: catalog
      service-dir: services/catalog-service
      coverage-artifact-name: catalog-coverage
