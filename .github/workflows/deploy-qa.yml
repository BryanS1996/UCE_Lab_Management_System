name: Deploy — QA

on:
  push:
    branches: [qa]

env:
  AWS_REGION: us-east-1

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      auth-service: ${{ steps.filter.outputs.auth-service }}
      reservation-service: ${{ steps.filter.outputs.reservation-service }}
      laboratory-service: ${{ steps.filter.outputs.laboratory-service }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      catalog-service: ${{ steps.filter.outputs.catalog-service }}
      payment-service: ${{ steps.filter.outputs.payment-service }}
      incident-service: ${{ steps.filter.outputs.incident-service }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth-service: 'services/auth-service/**'
            reservation-service: 'services/reservation-service/**'
            laboratory-service: 'services/laboratory-service/**'
            notification-service: 'services/notification-service/**'
            catalog-service: 'services/catalog-service/**'
            payment-service: 'services/payment-service/**'
            incident-service: 'services/incident-service/**'
            api-gateway: 'services/api-gateway/**'
            frontend: 'apps/frontend/**'
            compose: 'docker-compose.qa.yml'

  test-all:
    name: Run All Tests
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service:
          - auth-service
          - reservation-service
          - laboratory-service
          - notification-service
          - catalog-service
          - payment-service
          - incident-service
    steps:
      - uses: actions/checkout@v4
        if: needs.detect-changes.outputs[matrix.service] == 'true' || needs.detect-changes.outputs.compose == 'true'
      - uses: actions/setup-node@v4
        if: needs.detect-changes.outputs[matrix.service] == 'true' || needs.detect-changes.outputs.compose == 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - name: Install, Build & Test
        if: needs.detect-changes.outputs[matrix.service] == 'true' || needs.detect-changes.outputs.compose == 'true'
        working-directory: services/${{ matrix.service }}
        run: |
          npm ci --legacy-peer-deps
          npm run build
          npm run test -- --forceExit --passWithNoTests

  build-and-deploy:
    name: Build & Deploy QA
    runs-on: ubuntu-latest
    needs: [detect-changes, test-all]
    environment: qa
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── AWS Auth ────────────────────────────────────────────────────────────
      # Explicitly passes AWS_SESSION_TOKEN for AWS Academy temporary credentials.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.QA_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.QA_AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.QA_AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Build & Push ────────────────────────────────────────────────────────
      - name: Build & Push — Auth Service
        if: needs.detect-changes.outputs.auth-service == 'true' || needs.detect-changes.outputs.compose == 'true'
        uses: docker/build-push-action@v5
        with:
          context: services/auth-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-auth-service:qa-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/uce-auth-service:qa-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — Reservation Service
        if: needs.detect-changes.outputs.reservation-service == 'true' || needs.detect-changes.outputs.compose == 'true'
        uses: docker/build-push-action@v5
        with:
          context: services/reservation-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-reservation-service:qa-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/uce-reservation-service:qa-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — Laboratory Service
        if: needs.detect-changes.outputs.laboratory-service == 'true' || needs.detect-changes.outputs.compose == 'true'
        uses: docker/build-push-action@v5
        with:
          context: services/laboratory-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-laboratory-service:qa-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/uce-laboratory-service:qa-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — Notification Service
        if: needs.detect-changes.outputs.notification-service == 'true' || needs.detect-changes.outputs.compose == 'true'
        uses: docker/build-push-action@v5
        with:
          context: services/notification-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-notification-service:qa-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/uce-notification-service:qa-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — Catalog Service
        if: needs.detect-changes.outputs.catalog-service == 'true' || needs.detect-changes.outputs.compose == 'true'
        uses: docker/build-push-action@v5
        with:
          context: services/catalog-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-catalog-service:qa-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/uce-catalog-service:qa-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — Incident Service
        if: needs.detect-changes.outputs.incident-service == 'true' || needs.detect-changes.outputs.compose == 'true'
        uses: docker/build-push-action@v5
        with:
          context: services/incident-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-incident-service:qa-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/uce-incident-service:qa-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — Payment Service
        if: needs.detect-changes.outputs.payment-service == 'true' || needs.detect-changes.outputs.compose == 'true'
        uses: docker/build-push-action@v5
        with:
          context: services/payment-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-payment-service:qa-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/uce-payment-service:qa-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — API Gateway
        if: needs.detect-changes.outputs.api-gateway == 'true' || needs.detect-changes.outputs.compose == 'true'
        uses: docker/build-push-action@v5
        with:
          context: services/api-gateway
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-api-gateway:qa-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/uce-api-gateway:qa-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — Frontend
        if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.compose == 'true'
        uses: docker/build-push-action@v5
        with:
          context: apps/frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-frontend:qa-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/uce-frontend:qa-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Dynamic IP Discovery ────────────────────────────────────────────────
      # Queries AWS for all RUNNING instances in the QA ASG by Name tag.
      # Formats the private IPs as a comma-separated string for appleboy/ssh-action.
      # No hardcoded IP secrets needed — works with ephemeral ASG instances.
      - name: Discover QA ASG instance IPs
        id: discover-ips
        run: |
          ASG_NAME="uce-lab-asg-qa"

          # 1. Fetch Instance IDs of instances that are fully 'InService' in the ASG
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names ${ASG_NAME} \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text \
            --region ${{ env.AWS_REGION }})

          if [ -z "$INSTANCE_IDS" ] || [ "$INSTANCE_IDS" == "None" ]; then
            echo "::error::No InService instances found in ASG '${ASG_NAME}'."
            exit 1
          fi

          # 2. Fetch the Private IPs for those specific Instance IDs
          PRIVATE_IPS=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_IDS \
            --query "Reservations[*].Instances[*].PrivateIpAddress" \
            --output text \
            --region ${{ env.AWS_REGION }} \
          | tr '\t\n' ',' | sed 's/,$//')

          # Validate that we found at least one IP before proceeding.
          if [ -z "$PRIVATE_IPS" ]; then
            echo "::error::No running instances found in ASG '${ASG_NAME}'. " \
                 "Ensure the QA environment was applied and instances are healthy."
            exit 1
          fi

          echo "Discovered QA instance IPs: ${PRIVATE_IPS}"
          # Write to GITHUB_OUTPUT so subsequent steps can reference it.
          echo "app_ips=${PRIVATE_IPS}" >> "$GITHUB_OUTPUT"

      # ── Dynamic Bastion IP Discovery ────────────────────────────────────────
      - name: Discover QA Bastion IP
        id: discover-bastion
        run: |
          BASTION_NAME="uce-lab-bastion-qa"
          BASTION_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${BASTION_NAME}" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].PublicIpAddress" \
            --output text \
            --region ${{ env.AWS_REGION }})

          if [ -z "$BASTION_IP" ] || [ "$BASTION_IP" == "None" ]; then
            echo "::error::No running Bastion instance found with name '${BASTION_NAME}'."
            exit 1
          fi

          echo "Discovered QA Bastion IP: ${BASTION_IP}"
          echo "bastion_ip=${BASTION_IP}" >> "$GITHUB_OUTPUT"

      # ── SCP: copy compose file and DB scripts to ALL app instances ─────────────────────────
      # appleboy/scp-action also supports comma-separated hosts.
      - name: Copy compose file and DB scripts to QA EC2 instances
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.discover-ips.outputs.app_ips }}
          username: ec2-user
          key: ${{ secrets.QA_EC2_SSH_PRIVATE_KEY }}
          proxy_host: ${{ steps.discover-bastion.outputs.bastion_ip }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.QA_EC2_SSH_PRIVATE_KEY }}
          source: "docker-compose.qa.yml,db-init/"
          target: /home/ec2-user/app/

      # ── SSH Deploy ──────────────────────────────────────────────────────────
      # appleboy/ssh-action runs the script on ALL hosts when given a comma-
      # separated list — each instance pulls and restarts its containers.
      - name: Deploy to QA EC2 instances
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.discover-ips.outputs.app_ips }}
          username: ec2-user
          key: ${{ secrets.QA_EC2_SSH_PRIVATE_KEY }}
          proxy_host: ${{ steps.discover-bastion.outputs.bastion_ip }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.QA_EC2_SSH_PRIVATE_KEY }}
          # 'envs' securely injects variables into the remote shell.
          # They are NOT interpolated as plaintext into the script string.
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,AWS_REGION,IMAGE_TAG,ECR_REGISTRY,QA_ENV_FILE
          # sync: true ensures the script runs sequentially on each host,
          # providing a controlled rolling-style deploy across the ASG fleet.
          sync: true
          # Increased to 30m: pulling 5 images + waiting for DB/RabbitMQ
          # healthchecks can easily exceed the default 10m on a fresh instance.
          command_timeout: 30m
          script: |
            # Wait for EC2 user_data script to finish installing Docker + Compose plugin
            while ! command -v docker &> /dev/null || ! docker compose version &> /dev/null; do
              echo "⏳ Waiting for Docker and Compose plugin to finish installing..."
              sleep 10
            done
            
            cd /home/ec2-user/app
            
            # Escribir el archivo .env desde el GitHub Secret QA_ENV_FILE
            printf '%s\n' "$QA_ENV_FILE" > /home/ec2-user/app/.env

            # Re-authenticate with ECR using the session credentials passed via envs.
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker compose -f docker-compose.qa.yml pull \
              api-gateway-qa auth-service-qa reservation-service-qa laboratory-service-qa \
              notification-service-qa catalog-service-qa payment-service-qa incident-service-qa frontend-qa
            docker compose -f docker-compose.qa.yml up -d

            # Esperar a que los servicios estén listos (hasta 3 minutos)
            echo "⏳ Waiting for API Gateway to be ready..."
            for i in $(seq 1 18); do
              if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
                echo "✅ API Gateway QA OK (attempt $i)"
                break
              fi
              if [ "$i" -eq 18 ]; then
                echo "❌ API Gateway did not respond after 3 minutes"
                docker compose -f docker-compose.qa.yml logs --tail=50 api-gateway-qa
                exit 1
              fi
              echo "   attempt $i/18 — retrying in 10s..."
              sleep 10
            done

            echo "⏳ Waiting for Frontend to be ready..."
            for i in $(seq 1 12); do
              if curl -sf http://localhost/health.html > /dev/null 2>&1; then
                echo "✅ Frontend QA OK (attempt $i)"
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "❌ Frontend did not respond after 2 minutes"
                docker compose -f docker-compose.qa.yml logs --tail=50 frontend-qa
                exit 1
              fi
              echo "   attempt $i/12 — retrying in 10s..."
              sleep 10
            done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.QA_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.QA_AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.QA_AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ env.AWS_REGION }}
          IMAGE_TAG: qa-${{ github.sha }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          QA_ENV_FILE: ${{ secrets.QA_ENV_FILE }}