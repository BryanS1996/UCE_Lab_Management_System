name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - qa

jobs:
  # ─────────────────────────────────────────────────────
  # 1. DETECT WHICH MICROSERVICES CHANGED
  # ─────────────────────────────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      reservation: ${{ steps.filter.outputs.reservation }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'services/auth-service/**'
            reservation:
              - 'services/reservation-service/**'

  # ─────────────────────────────────────────────────────
  # 2. BUILD AUTH SERVICE (Only if changes occurred)
  # ─────────────────────────────────────────────────────
  build-auth:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.auth == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Asignar Etiqueta (qa o prod)
        run: echo "TAG=${{ github.ref == 'refs/heads/main' && 'prod' || 'qa' }}" >> $GITHUB_ENV
      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth-service
          push: true
          tags: bryanfabricio96/auth-service:${{ env.TAG }}

  # ─────────────────────────────────────────────────────
  # 3. BUILD RESERVATION SERVICE (Only if there were changes)
  # ─────────────────────────────────────────────────────
  build-reservation:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.reservation == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Asignar Etiqueta (qa o prod)
        run: echo "TAG=${{ github.ref == 'refs/heads/main' && 'prod' || 'qa' }}" >> $GITHUB_ENV
      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./services/reservation-service
          push: true
          tags: bryanfabricio96/reservation-service:${{ env.TAG }}