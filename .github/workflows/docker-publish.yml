name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - qa

jobs:
  # ─────────────────────────────────────────────────────
  # 1. DETECTAR QUÉ MICROSERVICIOS CAMBIARON
  # ─────────────────────────────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      reservation: ${{ steps.filter.outputs.reservation }}
      laboratory: ${{ steps.filter.outputs.laboratory }}
      notification: ${{ steps.filter.outputs.notification }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'services/auth-service/**'
            reservation:
              - 'services/reservation-service/**'
            laboratory:
              - 'services/laboratory-service/**'
            notification:
              - 'services/notification-service/**'

  # ─────────────────────────────────────────────────────
  # 2. CONSTRUIR AUTH SERVICE (Solo si hubo cambios)
  # ─────────────────────────────────────────────────────
  build-auth:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.auth == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Asignar Etiqueta (qa o prod)
        run: echo "TAG=${{ github.ref == 'refs/heads/main' && 'prod' || 'qa' }}" >> $GITHUB_ENV
      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth-service
          push: true
          tags: bryanfabricio96/auth-service:${{ env.TAG }}

  # ─────────────────────────────────────────────────────
  # 3. CONSTRUIR RESERVATION SERVICE (Solo si hubo cambios)
  # ─────────────────────────────────────────────────────
  build-reservation:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.reservation == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Asignar Etiqueta (qa o prod)
        run: echo "TAG=${{ github.ref == 'refs/heads/main' && 'prod' || 'qa' }}" >> $GITHUB_ENV
      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./services/reservation-service
          push: true
          tags: bryanfabricio96/reservation-service:${{ env.TAG }}

  # ─────────────────────────────────────────────────────
  # 4. CONSTRUIR LABORATORY SERVICE (Solo si hubo cambios)
  # ─────────────────────────────────────────────────────
  build-laboratory:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.laboratory == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Asignar Etiqueta (qa o prod)
        run: echo "TAG=${{ github.ref == 'refs/heads/main' && 'prod' || 'qa' }}" >> $GITHUB_ENV
      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./services/laboratory-service
          push: true
          tags: bryanfabricio96/laboratory-service:${{ env.TAG }}

  # ─────────────────────────────────────────────────────
  # 5. CONSTRUIR NOTIFICATION SERVICE (Solo si hubo cambios)
  # ─────────────────────────────────────────────────────
  build-notification:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.notification == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Asignar Etiqueta (qa o prod)
        run: echo "TAG=${{ github.ref == 'refs/heads/main' && 'prod' || 'qa' }}" >> $GITHUB_ENV
      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./services/notification-service
          push: true
          tags: bryanfabricio96/notification-service:${{ env.TAG }}