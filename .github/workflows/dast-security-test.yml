# ──────────────────────────────────────────────────────────────────────────────
# 🔒 Pruebas de Seguridad DAST — OWASP ZAP
# Ejecuta 5 escaneos de seguridad contra el entorno QA en AWS.
# Orden secuencial: Baseline Frontend → Baseline API → Active Auth →
#                    Headers Audit → Full API Scan
# Se dispara manualmente o es invocado por qa-quality-gate.yml.
#
# ⚠️  SEGURIDAD: Los Active Scans usan attackStrength=LOW para evitar
#     acciones destructivas. Los métodos DELETE/PUT están excluidos.
# ──────────────────────────────────────────────────────────────────────────────
name: "Security Tests — OWASP ZAP DAST"

on:
  workflow_dispatch:
  workflow_call:

jobs:
  # ── ZAP-DAST-01: Escaneo pasivo del Frontend ──────────────────────────────
  zap-dast-01-frontend-baseline:
    name: "🔒 ZAP-DAST-01 — Frontend Baseline Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🔍 Escaneo Baseline del Frontend QA
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ secrets.QA_FRONTEND_URL }}
          rules_file_name: "tests/security/zap-rules.tsv"
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-j"
          artifact_name: "zap-dast-01-frontend-baseline"

      - name: 📊 Publicar resumen
        if: always()
        run: |
          echo "## 🔒 ZAP-DAST-01 — Frontend Baseline Scan" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Target** | \`${{ secrets.QA_FRONTEND_URL }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tipo** | Baseline (pasivo) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Fecha** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

  # ── ZAP-DAST-02: Escaneo pasivo del API Gateway ───────────────────────────
  zap-dast-02-api-baseline:
    name: "🔒 ZAP-DAST-02 — API Gateway Baseline Scan"
    runs-on: ubuntu-latest
    needs: zap-dast-01-frontend-baseline
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🔍 Escaneo Baseline del API Gateway QA
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ secrets.QA_API_GATEWAY_URL }}
          rules_file_name: "tests/security/zap-rules.tsv"
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-j"
          artifact_name: "zap-dast-02-api-baseline"

      - name: 📊 Publicar resumen
        if: always()
        run: |
          echo "## 🔒 ZAP-DAST-02 — API Gateway Baseline Scan" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Target** | \`${{ secrets.QA_API_GATEWAY_URL }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tipo** | Baseline (pasivo) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Fecha** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

  # ── ZAP-DAST-03: Escaneo activo del endpoint de autenticación ─────────────
  # ⚠️ attackStrength=LOW para minimizar impacto en datos de QA
  zap-dast-03-auth-active:
    name: "🔒 ZAP-DAST-03 — Auth API Active Scan"
    runs-on: ubuntu-latest
    needs: zap-dast-02-api-baseline
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: ⚡ Escaneo Activo del endpoint de Autenticación
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: "${{ secrets.QA_API_GATEWAY_URL }}/api/auth"
          rules_file_name: "tests/security/zap-rules.tsv"
          allow_issue_writing: false
          cmd_options: >-
            -j
            -z "-config scanner.attackStrength=LOW
                -config scanner.maxRuleDurationInMins=5"
          artifact_name: "zap-dast-03-auth-active"

      - name: 📊 Publicar resumen
        if: always()
        run: |
          echo "## 🔒 ZAP-DAST-03 — Auth API Active Scan" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Target** | \`${{ secrets.QA_API_GATEWAY_URL }}/api/auth\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tipo** | Full Scan (activo) — attackStrength=LOW |" >> $GITHUB_STEP_SUMMARY
          echo "| **Fecha** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

  # ── ZAP-DAST-04: Auditoría de Security Headers ────────────────────────────
  zap-dast-04-headers-audit:
    name: "🔒 ZAP-DAST-04 — Security Headers Audit"
    runs-on: ubuntu-latest
    needs: zap-dast-03-auth-active
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🔍 Auditoría de Headers de Seguridad
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ secrets.QA_FRONTEND_URL }}
          # No usar zap-rules.tsv aquí — queremos ver TODOS los headers faltantes
          fail_action: false
          allow_issue_writing: false
          cmd_options: >-
            -j
            -z "-config pscan.enableTags=security
                -config pscan.scanner.10021.enabled=true
                -config pscan.scanner.10035.enabled=true
                -config pscan.scanner.10036.enabled=true
                -config pscan.scanner.10037.enabled=true
                -config pscan.scanner.10038.enabled=true"
          artifact_name: "zap-dast-04-headers-audit"

      - name: 📊 Publicar resumen
        if: always()
        run: |
          echo "## 🔒 ZAP-DAST-04 — Security Headers Audit" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Target** | \`${{ secrets.QA_FRONTEND_URL }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tipo** | Baseline con foco en Security Headers |" >> $GITHUB_STEP_SUMMARY
          echo "| **Headers evaluados** | CSP, X-Content-Type-Options, HSTS, X-Powered-By, Server |" >> $GITHUB_STEP_SUMMARY
          echo "| **Fecha** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

  # ── ZAP-DAST-05: Full Scan del API Gateway ────────────────────────────────
  # ⚠️ attackStrength=LOW + métodos destructivos (DELETE/PUT) excluidos
  zap-dast-05-api-full:
    name: "🔒 ZAP-DAST-05 — API Full Scan"
    runs-on: ubuntu-latest
    needs: zap-dast-04-headers-audit
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: ⚡ Full Scan del API Gateway QA
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: ${{ secrets.QA_API_GATEWAY_URL }}
          rules_file_name: "tests/security/zap-rules.tsv"
          allow_issue_writing: false
          cmd_options: >-
            -j
            -z "-config scanner.attackStrength=LOW
                -config scanner.maxRuleDurationInMins=10
                -config spider.excludedHttpMethods=DELETE,PUT,PATCH"
          artifact_name: "zap-dast-05-api-full"

      - name: 📊 Publicar resumen
        if: always()
        run: |
          echo "## 🔒 ZAP-DAST-05 — API Full Scan" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Target** | \`${{ secrets.QA_API_GATEWAY_URL }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tipo** | Full Scan (activo) — attackStrength=LOW, sin DELETE/PUT/PATCH |" >> $GITHUB_STEP_SUMMARY
          echo "| **Fecha** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

  # ── Resumen consolidado de DAST ────────────────────────────────────────────
  dast-summary:
    name: "📊 Resumen Consolidado DAST"
    runs-on: ubuntu-latest
    needs:
      - zap-dast-01-frontend-baseline
      - zap-dast-02-api-baseline
      - zap-dast-03-auth-active
      - zap-dast-04-headers-audit
      - zap-dast-05-api-full
    if: always()
    steps:
      - name: 📊 Resumen final de escaneos DAST
        run: |
          echo "## 🔒 Resumen Consolidado — Pruebas DAST OWASP ZAP" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| # | Escaneo | Resultado |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | ZAP-DAST-01 Frontend Baseline | ${{ needs.zap-dast-01-frontend-baseline.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 | ZAP-DAST-02 API Baseline | ${{ needs.zap-dast-02-api-baseline.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 | ZAP-DAST-03 Auth Active | ${{ needs.zap-dast-03-auth-active.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 4 | ZAP-DAST-04 Headers Audit | ${{ needs.zap-dast-04-headers-audit.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 5 | ZAP-DAST-05 API Full Scan | ${{ needs.zap-dast-05-api-full.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Los reportes HTML de cada escaneo están disponibles en la sección **Artifacts** de este workflow run." >> $GITHUB_STEP_SUMMARY
