name: Notification Service — CI

on:
  push:
    paths:
      - 'services/notification-service/**'
      - '.github/workflows/_service-ci.yml'
  pull_request:
    branches: [ "qa" ]
    paths:
      - 'services/notification-service/**'
      - '.github/workflows/_service-ci.yml'
  workflow_dispatch:

jobs:
  lint-and-test:
    uses: ./.github/workflows/_service-ci.yml
    secrets: inherit
    with:
      service-name: notification
      service-dir: services/notification-service
      coverage-artifact-name: notification-coverage
