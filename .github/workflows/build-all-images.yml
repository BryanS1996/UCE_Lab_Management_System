name: 🔨 Build All Images — Force Push to ECR

# Workflow de emergencia: construye y sube TODAS las imágenes a ECR sin
# ninguna lógica de detección de cambios. Úsalo cuando una imagen esté
# ausente en ECR y el deploy normal no la construya por no detectar cambios.

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  build-all:
    name: Build & Push ALL Images to ECR
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.PROD_AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push — Auth Service
        uses: docker/build-push-action@v5
        with:
          context: services/auth-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-auth-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — Reservation Service
        uses: docker/build-push-action@v5
        with:
          context: services/reservation-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-reservation-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — Laboratory Service
        uses: docker/build-push-action@v5
        with:
          context: services/laboratory-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-laboratory-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — Notification Service
        uses: docker/build-push-action@v5
        with:
          context: services/notification-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-notification-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — Catalog Service
        uses: docker/build-push-action@v5
        with:
          context: services/catalog-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-catalog-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — Payment Service
        uses: docker/build-push-action@v5
        with:
          context: services/payment-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-payment-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — Incident Service
        uses: docker/build-push-action@v5
        with:
          context: services/incident-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-incident-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — API Gateway
        uses: docker/build-push-action@v5
        with:
          context: services/api-gateway
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — Frontend
        uses: docker/build-push-action@v5
        with:
          context: apps/frontend
          push: true
          build-args: |
            ENV=prod
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ✅ Resumen
        run: |
          echo "=========================================="
          echo "✅ Todas las imágenes fueron subidas a ECR"
          echo "   Registry: ${{ steps.login-ecr.outputs.registry }}"
          echo "   - uce-auth-service:latest"
          echo "   - uce-reservation-service:latest"
          echo "   - uce-laboratory-service:latest"
          echo "   - uce-notification-service:latest"
          echo "   - uce-catalog-service:latest"
          echo "   - uce-payment-service:latest"
          echo "   - uce-incident-service:latest"
          echo "   - uce-api-gateway:latest"
          echo "   - uce-frontend:latest"
          echo "=========================================="
          echo "Ahora ejecuta el workflow 'Deploy — Production' para desplegar."
