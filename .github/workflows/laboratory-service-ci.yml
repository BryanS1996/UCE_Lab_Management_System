name: Laboratory Service — CI

on:
  push:
    paths:
      - 'services/laboratory-service/**'
      - '.github/workflows/_service-ci.yml'
  pull_request:
    paths:
      - 'services/laboratory-service/**'
      - '.github/workflows/_service-ci.yml'
  workflow_dispatch:

jobs:
  lint-and-test:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service-name: laboratory
      service-dir: services/laboratory-service
      coverage-artifact-name: laboratory-coverage
