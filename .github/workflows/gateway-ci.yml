name: API Gateway — CI

on:
  push:
    paths:
      - 'services/api-gateway/**'
      - '.github/workflows/_service-ci.yml'
  pull_request:
    paths:
      - 'services/api-gateway/**'
      - '.github/workflows/_service-ci.yml'
  workflow_dispatch:

jobs:
  lint-and-test:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service-name: gateway
      service-dir: services/api-gateway
      coverage-artifact-name: gateway-coverage
