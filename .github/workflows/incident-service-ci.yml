name: Incident Service — CI

on:
  push:
    paths:
      - 'services/incident-service/**'
      - '.github/workflows/_service-ci.yml'
  pull_request:
    branches: [ "qa" ]
    paths:
      - 'services/incident-service/**'
      - '.github/workflows/_service-ci.yml'
  workflow_dispatch:

jobs:
  lint-and-test:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service-name: incident
      service-dir: services/incident-service
      coverage-artifact-name: incident-coverage
