name: Deploy — Production

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1

jobs:
  test-all:
    name: Run All Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [auth-service, reservation-service, laboratory-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - name: Install, Build & Test
        working-directory: services/${{ matrix.service }}
        run: |
          npm ci --legacy-peer-deps
          npm run build
          npm run test -- --forceExit

  build-and-deploy:
    name: Build & Deploy Production
    runs-on: ubuntu-latest
    needs: test-all
    environment: production
    steps:
      - uses: actions/checkout@v4

      # ── AWS Auth ────────────────────────────────────────────────────────────
      # Explicitly passes AWS_SESSION_TOKEN for AWS Academy temporary credentials.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.PROD_AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Build & Push ────────────────────────────────────────────────────────
      - name: Build & Push — Auth Service
        uses: docker/build-push-action@v5
        with:
          context: services/auth-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-auth-service:latest
            ${{ steps.login-ecr.outputs.registry }}/uce-auth-service:${{ github.sha }}

      - name: Build & Push — Reservation Service
        uses: docker/build-push-action@v5
        with:
          context: services/reservation-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-reservation-service:latest
            ${{ steps.login-ecr.outputs.registry }}/uce-reservation-service:${{ github.sha }}

      - name: Build & Push — Laboratory Service
        uses: docker/build-push-action@v5
        with:
          context: services/laboratory-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-laboratory-service:latest
            ${{ steps.login-ecr.outputs.registry }}/uce-laboratory-service:${{ github.sha }}

      - name: Build & Push — Notification Service
        uses: docker/build-push-action@v5
        with:
          context: services/notification-service
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-notification-service:latest
            ${{ steps.login-ecr.outputs.registry }}/uce-notification-service:${{ github.sha }}

      - name: Build & Push — API Gateway
        uses: docker/build-push-action@v5
        with:
          context: services/api-gateway
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-api-gateway:latest
            ${{ steps.login-ecr.outputs.registry }}/uce-api-gateway:${{ github.sha }}

      - name: Build & Push — Frontend
        uses: docker/build-push-action@v5
        with:
          context: apps/frontend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/uce-frontend:latest
            ${{ steps.login-ecr.outputs.registry }}/uce-frontend:${{ github.sha }}

      # ── Dynamic IP Discovery ────────────────────────────────────────────────
      # Queries AWS for all RUNNING instances in the Production ASG by Name tag.
      # Formats the private IPs as a comma-separated string for appleboy/ssh-action.
      # No hardcoded IP secrets needed — works with ephemeral ASG instances.
      - name: Discover Production ASG instance IPs
        id: discover-ips
        run: |
          ASG_NAME="uce-lab-asg-prod"

          # Fetch private IPs of all running instances tagged with the ASG name.
          # The ASG automatically tags instances with: Name=<asg-name> and
          # aws:autoscaling:groupName=<asg-name>. We filter on the latter to be
          # precise, falling back to the Name tag which the launch template sets.
          PRIVATE_IPS=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:aws:autoscaling:groupName,Values=${ASG_NAME}" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].PrivateIpAddress" \
            --output text \
            --region ${{ env.AWS_REGION }} \
          | tr '\t\n' ',' | sed 's/,$//')

          # Validate that we found at least one IP before proceeding.
          if [ -z "$PRIVATE_IPS" ]; then
            echo "::error::No running instances found in ASG '${ASG_NAME}'. " \
                 "Ensure the Production environment was applied and instances are healthy."
            exit 1
          fi

          echo "Discovered Production instance IPs: ${PRIVATE_IPS}"
          # Write to GITHUB_OUTPUT so subsequent steps can reference it.
          echo "app_ips=${PRIVATE_IPS}" >> "$GITHUB_OUTPUT"

      # ── SCP: copy compose file and DB scripts to ALL app instances ─────────────────────────
      # appleboy/scp-action also supports comma-separated hosts.
      - name: Copy compose file and DB scripts to Production EC2 instances
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ steps.discover-ips.outputs.app_ips }}
          username: ec2-user
          key: ${{ secrets.PROD_EC2_SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.PROD_BASTION_PUBLIC_IP }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.PROD_EC2_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,db-init/"
          target: /home/ec2-user/app/

      # ── SSH Deploy ──────────────────────────────────────────────────────────
      # appleboy/ssh-action runs the script on ALL hosts when given a comma-
      # separated list — each instance pulls and restarts its containers.
      - name: Deploy to Production EC2 instances
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.discover-ips.outputs.app_ips }}
          username: ec2-user
          key: ${{ secrets.PROD_EC2_SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.PROD_BASTION_PUBLIC_IP }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.PROD_EC2_SSH_PRIVATE_KEY }}
          # 'envs' securely injects variables into the remote shell.
          # They are NOT interpolated as plaintext into the script string.
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,AWS_REGION,IMAGE_TAG,ECR_REGISTRY
          # sync: true ensures the script runs sequentially on each host,
          # providing a controlled rolling-style deploy across the ASG fleet.
          sync: true
          # Increased to 30m: pulling images + waiting for DB/RabbitMQ
          # healthchecks can easily exceed the default 10m on a fresh instance.
          command_timeout: 30m
          script: |
            # Wait for EC2 user_data script to finish installing Docker + Compose plugin
            while ! command -v docker &> /dev/null || ! docker compose version &> /dev/null; do
              echo "⏳ Waiting for Docker and Compose plugin to finish installing..."
              sleep 10
            done

            cd /home/ec2-user/app
            # Re-authenticate with ECR using the session credentials passed via envs.
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker compose -f docker-compose.prod.yml pull \
              api-gateway auth-service reservation-service laboratory-service notification-service frontend
            docker compose -f docker-compose.prod.yml up -d

            # Esperar a que los servicios estén listos (hasta 3 minutos)
            echo "⏳ Waiting for API Gateway to be ready..."
            for i in $(seq 1 18); do
              if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
                echo "✅ API Gateway PROD OK (attempt $i)"
                break
              fi
              if [ "$i" -eq 18 ]; then
                echo "❌ API Gateway did not respond after 3 minutes"
                docker compose -f docker-compose.prod.yml logs --tail=50 api-gateway
                exit 1
              fi
              echo "   attempt $i/18 — retrying in 10s..."
              sleep 10
            done

            echo "⏳ Waiting for Frontend to be ready..."
            for i in $(seq 1 12); do
              if curl -sf http://localhost/health.html > /dev/null 2>&1; then
                echo "✅ Frontend PROD OK (attempt $i)"
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "❌ Frontend did not respond after 2 minutes"
                docker compose -f docker-compose.prod.yml logs --tail=50 frontend
                exit 1
              fi
              echo "   attempt $i/12 — retrying in 10s..."
              sleep 10
            done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.PROD_AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ env.AWS_REGION }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
