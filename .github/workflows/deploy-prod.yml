name: Deploy — Production

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1

jobs:
  test-all:
    name: Run All Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [auth-service, reservation-service, laboratory-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - name: Install, Build & Test
        working-directory: services/${{ matrix.service }}
        run: |
          npm ci --legacy-peer-deps
          npm run build
          npm run test -- --forceExit

  build-and-deploy:
    name: Build & Deploy Production
    runs-on: ubuntu-latest
    needs: test-all
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.PROD_AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set AWS credentials for SSH steps
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.PROD_AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=${{ secrets.PROD_AWS_SESSION_TOKEN }}" >> $GITHUB_ENV

      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push all services
        run: |
          for service in auth-service reservation-service laboratory-service notification-service; do
            echo "Building $service..."
            docker build -t ${{ steps.login-ecr.outputs.registry }}/uce-$service:latest \
              -t ${{ steps.login-ecr.outputs.registry }}/uce-$service:${{ github.sha }} \
              services/$service
            docker push ${{ steps.login-ecr.outputs.registry }}/uce-$service:latest
            docker push ${{ steps.login-ecr.outputs.registry }}/uce-$service:${{ github.sha }}
          done

      - name: Copy compose file to Production EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_APP_PRIVATE_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.PROD_BASTION_PUBLIC_IP }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yml
          target: /home/ec2-user/app/

      - name: Deploy to Production EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.PROD_AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ env.AWS_REGION }}
        with:
          host: ${{ secrets.PROD_APP_PRIVATE_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          proxy_host: ${{ secrets.PROD_BASTION_PUBLIC_IP }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ec2-user/app
            export IMAGE_TAG=${{ github.sha }}
            export ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
            export AWS_ACCESS_KEY_ID=${{ env.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ env.AWS_SECRET_ACCESS_KEY }}
            export AWS_SESSION_TOKEN=${{ env.AWS_SESSION_TOKEN }}
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            sleep 25
            curl -f http://localhost:3000/health && echo " Auth PROD OK"
            curl -f http://localhost:3001/health && echo " Reservation PROD OK"
            curl -f http://localhost:3002/health && echo " Laboratory PROD OK"
            curl -f http://localhost:3003/health && echo " Notification PROD OK"
