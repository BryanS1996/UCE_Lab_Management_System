name: 📝 Obtener Logs de Produccion

on:
  workflow_dispatch:
    inputs:
      lines:
        description: 'Número de líneas a mostrar por cada servicio'
        required: true
        default: '100'

env:
  AWS_REGION: us-east-1

jobs:
  fetch-logs:
    name: Fetch Docker Logs from PROD
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.PROD_AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover PROD IPs (Bastion & App)
        id: discover-ips
        run: |
          BASTION_IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=uce-lab-bastion-prod" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].PublicIpAddress" --output text)

          # Fetch InService instances in ASG
          ASG_INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "uce-lab-asg-prod" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)

          APP_IP=$(aws ec2 describe-instances \
            --instance-ids $ASG_INSTANCE_IDS \
            --query "Reservations[*].Instances[*].PrivateIpAddress" \
            --output text | tr '\t\n' ',' | sed 's/,$//')

          echo "bastion_ip=${BASTION_IP}" >> "$GITHUB_OUTPUT"
          echo "app_ip=${APP_IP}" >> "$GITHUB_OUTPUT"

      - name: Extract Logs via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.discover-ips.outputs.app_ip }}
          username: ec2-user
          key: ${{ secrets.PROD_EC2_SSH_PRIVATE_KEY }}
          proxy_host: ${{ steps.discover-ips.outputs.bastion_ip }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.PROD_EC2_SSH_PRIVATE_KEY }}
          script: |
            echo "=========================================================="
            echo "🐳 LOGS DE TODOS LOS SERVICIOS QUE NO INICIAN"
            echo "=========================================================="
            cd /home/ec2-user/app
            
            echo -e "\n--- payment-service ---"
            docker compose -f docker-compose.prod.yml logs --tail ${{ github.event.inputs.lines }} payment-service
            
            echo -e "\n--- auth-service ---"
            docker compose -f docker-compose.prod.yml logs --tail ${{ github.event.inputs.lines }} auth-service
            
            echo -e "\n--- reservation-service ---"
            docker compose -f docker-compose.prod.yml logs --tail ${{ github.event.inputs.lines }} reservation-service
            
            echo -e "\n--- incident-service ---"
            docker compose -f docker-compose.prod.yml logs --tail ${{ github.event.inputs.lines }} incident-service
            
            echo -e "\n--- api-gateway ---"
            docker compose -f docker-compose.prod.yml logs --tail ${{ github.event.inputs.lines }} api-gateway
