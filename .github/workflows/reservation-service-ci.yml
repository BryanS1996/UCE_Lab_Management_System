name: Reservation Service — CI

on:
  push:
    branches:
      - feature/reservation-service
      - main
    paths:
      - 'services/reservation-service/**'
      - '.github/workflows/reservation-service-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'services/reservation-service/**'

jobs:
  test:
    name: 🧪 Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/reservation-service/package-lock.json

      - name: Instalar dependencias
        working-directory: services/reservation-service
        run: npm ci --legacy-peer-deps

      - name: Verificar compilación TypeScript
        working-directory: services/reservation-service
        run: npm run build

      - name: Ejecutar tests unitarios
        working-directory: services/reservation-service
        run: npm run test -- --forceExit --coverage

      - name: Subir reporte de coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: services/reservation-service/coverage/
          retention-days: 7
