name: Reservation Service — CI

on:
  push:
    paths:
      - 'services/reservation-service/**'
      - '.github/workflows/_service-ci.yml'
  pull_request:
    paths:
      - 'services/reservation-service/**'
      - '.github/workflows/_service-ci.yml'
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service-name: reservation
      service-dir: services/reservation-service
      coverage-artifact-name: reservation-coverage
