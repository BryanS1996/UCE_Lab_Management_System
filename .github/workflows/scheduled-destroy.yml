name: ⏹ Nightly Destroy — QA

on:
  schedule:
    # Runs at 03:00 UTC every night — tears down QA to avoid AWS Academy charges
    - cron: '0 3 * * *'
  # Allow manual trigger for emergencies
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  terraform-destroy-qa:
    name: Terraform Destroy — QA
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.0'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.QA_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.QA_AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.QA_AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify backend variables
        run: |
          if [ -z "${{ vars.TF_STATE_BUCKET }}" ] || [ -z "${{ vars.TF_LOCK_TABLE }}" ]; then
            echo "::error::Missing TF_STATE_BUCKET or TF_LOCK_TABLE in the QA Environment."
            exit 1
          fi

      - name: Terraform Init (S3 backend)
        working-directory: infra/terraform/environments/qa
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
          TF_AWS_REGION: ${{ vars.TF_AWS_REGION }}
        run: bash ../../scripts/init-backend.sh qa

      - name: Terraform Destroy — QA only
        working-directory: infra/terraform/environments/qa
        run: |
          terraform destroy -auto-approve \
            -var="enable_rds=false" \
            -var="db_password=${{ secrets.DB_PASSWORD }}"

      - name: Notify destroy completed
        run: echo "✅ QA infrastructure destroyed at $(date -u '+%Y-%m-%d %H:%M UTC')"
