name: Payment Service — CI

on:
  push:
    paths:
      - 'services/payment-service/**'
      - '.github/workflows/_service-ci.yml'
  pull_request:
    paths:
      - 'services/payment-service/**'
      - '.github/workflows/_service-ci.yml'
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service-name: payment
      service-dir: services/payment-service
      coverage-artifact-name: payment-coverage
