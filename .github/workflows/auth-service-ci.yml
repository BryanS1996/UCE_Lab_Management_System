name: Auth Service — CI

on:
  push:
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/_service-ci.yml'
  pull_request:
    paths:
      - 'services/auth-service/**'
      - '.github/workflows/_service-ci.yml'
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/_service-ci.yml
    with:
      service-name: auth
      service-dir: services/auth-service
      coverage-artifact-name: auth-coverage
