name: Auth Service — CI

# Deshabilitado: La validación se maneja centralmente en pr-validation.yml
# La construcción se maneja en docker-publish.yml
on:
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/auth-service/package-lock.json
      - name: Install
        working-directory: services/auth-service
        run: npm ci --legacy-peer-deps
      - name: Build
        working-directory: services/auth-service
        run: npm run build
      - name: Test
        working-directory: services/auth-service
        run: npm run test -- --forceExit --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-coverage
          path: services/auth-service/coverage/
          retention-days: 7
