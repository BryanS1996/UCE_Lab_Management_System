version: '3.8'

services:
  # ─── QA: Auth Database ───────────────────────────────
  auth-db-qa:
    image: postgres:15-alpine
    container_name: auth-db-qa
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpassword
      POSTGRES_DB: auth_service_qa
    # No ports exposed — QA DBs are internal-only, accessible via Bastion SSH if needed
    volumes:
      - auth-db-qa-data:/var/lib/postgresql/data
    networks:
      - uce-qa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── QA: Auth Service (puerto 3010) ──────────────────
  auth-service-qa:
    image: ${ECR_REGISTRY:-localhost}/uce-auth-service:${IMAGE_TAG:-qa-latest}
    container_name: auth-service-qa
    environment:
      NODE_ENV: qa
      PORT: 3010
      DB_HOST: auth-db-qa
      DB_PORT: 5432
      DB_USERNAME: authuser
      DB_PASSWORD: authpassword
      DB_NAME: auth_service_qa
      DB_SSL: "false"
      JWT_SECRET: qa-secret-key-change-in-production
      CORS_ORIGIN: "*"
    depends_on:
      auth-db-qa:
        condition: service_healthy
    networks:
      - uce-qa-network
    restart: unless-stopped

  # ─── QA: Reservation Database ────────────────────────
  reservation-db-qa:
    image: postgres:15-alpine
    container_name: reservation-db-qa
    environment:
      POSTGRES_USER: reservationuser
      POSTGRES_PASSWORD: reservationpassword
      POSTGRES_DB: reservation_service_qa
    # No ports exposed — QA DBs are internal-only, accessible via Bastion SSH if needed
    volumes:
      - reservation-db-qa-data:/var/lib/postgresql/data
    networks:
      - uce-qa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservationuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── QA: RabbitMQ (puerto 5673 / 15673) ──────────────
  rabbitmq-qa:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-qa
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    # RabbitMQ management UI and AMQP port are internal-only in QA.
    # Access via SSH tunnel through the Bastion if needed.
    volumes:
      - rabbitmq-qa-data:/var/lib/rabbitmq
    networks:
      - uce-qa-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── QA: Reservation Service (puerto 3011) ───────────
  reservation-service-qa:
    image: ${ECR_REGISTRY:-localhost}/uce-reservation-service:${IMAGE_TAG:-qa-latest}
    container_name: reservation-service-qa
    environment:
      NODE_ENV: qa
      PORT: 3011
      DB_HOST: reservation-db-qa
      DB_PORT: 5432
      DB_USERNAME: reservationuser
      DB_PASSWORD: reservationpassword
      DB_NAME: reservation_service_qa
      DB_SSL: "false"
      JWT_SECRET: qa-secret-key-change-in-production
      CORS_ORIGIN: "*"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-qa:5672
      KAFKA_BROKERS: kafka-qa:29092
    depends_on:
      reservation-db-qa:
        condition: service_healthy
      rabbitmq-qa:
        condition: service_healthy
      kafka-qa:
        condition: service_started
    networks:
      - uce-qa-network
    restart: unless-stopped

  # ─── QA: Laboratory Database ─────────────────────────
  laboratory-db-qa:
    image: postgres:15-alpine
    container_name: laboratory-db-qa
    environment:
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: labpassword
      POSTGRES_DB: laboratory_service_qa
    # No ports exposed — QA DBs are internal-only, accessible via Bastion SSH if needed
    volumes:
      - laboratory-db-qa-data:/var/lib/postgresql/data
      - ./db-init/init-laboratories.sql:/docker-entrypoint-initdb.d/init-laboratories.sql
    networks:
      - uce-qa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── QA: Laboratory Service (puerto 3012) ────────────
  laboratory-service-qa:
    image: ${ECR_REGISTRY:-localhost}/uce-laboratory-service:${IMAGE_TAG:-qa-latest}
    container_name: laboratory-service-qa
    environment:
      NODE_ENV: qa
      PORT: 3012
      DB_HOST: laboratory-db-qa
      DB_PORT: 5432
      DB_USERNAME: labuser
      DB_PASSWORD: labpassword
      DB_NAME: laboratory_service_qa
      DB_SSL: "false"
      JWT_SECRET: qa-secret-key-change-in-production
      CORS_ORIGIN: "*"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-qa:5672
      MQTT_URL: mqtt://mosquitto-qa:1883
    depends_on:
      laboratory-db-qa:
        condition: service_healthy
      rabbitmq-qa:
        condition: service_healthy
    networks:
      - uce-qa-network
    restart: unless-stopped

  # ─── QA: Notification Database ───────────────────────
  notification-db-qa:
    image: postgres:15-alpine
    container_name: notification-db-qa
    environment:
      POSTGRES_USER: notifuser
      POSTGRES_PASSWORD: notifpassword
      POSTGRES_DB: notification_service_qa
    # No ports exposed — QA DBs are internal-only, accessible via Bastion SSH if needed
    volumes:
      - notification-db-qa-data:/var/lib/postgresql/data
    networks:
      - uce-qa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── QA: Notification Service (puerto 3013) ──────────
  notification-service-qa:
    image: ${ECR_REGISTRY:-localhost}/uce-notification-service:${IMAGE_TAG:-qa-latest}
    container_name: notification-service-qa
    environment:
      NODE_ENV: qa
      PORT: 3013
      DB_HOST: notification-db-qa
      DB_PORT: 5432
      DB_USERNAME: notifuser
      DB_PASSWORD: notifpassword
      DB_NAME: notification_service_qa
      DB_SSL: "false"
      JWT_SECRET: qa-secret-key-change-in-production
      CORS_ORIGIN: "*"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-qa:5672
      KAFKA_BROKERS: kafka-qa:29092
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MQTT_URL: mqtt://mosquitto-qa:1883
    depends_on:
      notification-db-qa:
        condition: service_healthy
      rabbitmq-qa:
        condition: service_healthy
      kafka-qa:
        condition: service_started
    networks:
      - uce-qa-network
    restart: unless-stopped

  # ─── QA: Catalog Database ────────────────────────────
  catalog-db-qa:
    image: postgres:15-alpine
    container_name: catalog-db-qa
    environment:
      POSTGRES_USER: cataloguser
      POSTGRES_PASSWORD: catalogpassword
      POSTGRES_DB: catalog_service_qa
    # No ports exposed — QA DBs are internal-only, accessible via Bastion SSH if needed
    volumes:
      - catalog-db-qa-data:/var/lib/postgresql/data
    networks:
      - uce-qa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cataloguser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── QA: Catalog Service (puerto 3014) ───────────────
  catalog-service-qa:
    image: ${ECR_REGISTRY:-localhost}/uce-catalog-service:${IMAGE_TAG:-qa-latest}
    container_name: catalog-service-qa
    environment:
      NODE_ENV: qa
      PORT: 3014
      DB_HOST: catalog-db-qa
      DB_PORT: 5432
      DB_USERNAME: cataloguser
      DB_PASSWORD: catalogpassword
      DB_NAME: catalog_service_qa
      DB_SSL: "false"
      JWT_SECRET: qa-secret-key-change-in-production
      CORS_ORIGIN: "*"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-qa:5672
      MQTT_URL: mqtt://mosquitto-qa:1883
    depends_on:
      catalog-db-qa:
        condition: service_healthy
      rabbitmq-qa:
        condition: service_healthy
      mosquitto-qa:
        condition: service_started
    networks:
      - uce-qa-network
    restart: unless-stopped

  # ─── QA: Incident Database ─────────────────────────────
  incident-db-qa:
    image: mongo:6
    container_name: incident-db-qa
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${INCIDENT_DB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${INCIDENT_DB_PASS:-admin}
    volumes:
      - incident-db-qa-data:/data/db
    networks:
      - uce-qa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── QA: Incident Service (puerto 3017) ──────────────
  incident-service-qa:
    image: ${ECR_REGISTRY:-localhost}/uce-incident-service:${IMAGE_TAG:-qa-latest}
    container_name: incident-service-qa
    pull_policy: always
    environment:
      NODE_ENV: qa
      PORT: 3017
      MONGODB_URI: mongodb://${INCIDENT_DB_USER:-admin}:${INCIDENT_DB_PASS:-admin}@incident-db-qa:27017/incident_service_qa?authSource=admin
      RESERVATION_SERVICE_URL: http://reservation-service-qa:3011
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      IA_LAMBDA_URL: ${IA_LAMBDA_URL}
    depends_on:
      incident-db-qa:
        condition: service_healthy
    networks:
      - uce-qa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3017/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  # ─── QA: Payment Service (puerto 3016) ───────────────
  payment-service-qa:
    image: ${ECR_REGISTRY:-localhost}/uce-payment-service:${IMAGE_TAG:-qa-latest}
    container_name: payment-service-qa
    environment:
      NODE_ENV: qa
      PORT: 3016
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-qa:5672
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_dummy}
      FRONTEND_URL: ${FRONTEND_URL_QA:-http://localhost:5173}
    depends_on:
      rabbitmq-qa:
        condition: service_healthy
    networks:
      - uce-qa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3016/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── QA: API Gateway ─────────────────────────────────
  api-gateway-qa:
    image: ${ECR_REGISTRY:-localhost}/uce-api-gateway:${IMAGE_TAG:-qa-latest}
    container_name: api-gateway-qa
    pull_policy: always
    environment:
      NODE_ENV: qa
      PORT: 3000
      # URLs internas usando los nombres de los contenedores
      AUTH_SERVICE_URL: http://auth-service-qa:3010
      RESERVATION_SERVICE_URL: http://reservation-service-qa:3011
      LABORATORY_SERVICE_URL: http://laboratory-service-qa:3012
      NOTIFICATION_SERVICE_URL: http://notification-service-qa:3013
      CATALOG_SERVICE_URL: http://catalog-service-qa:3014
      PAYMENT_SERVICE_URL: http://payment-service-qa:3016
      INCIDENT_SERVICE_URL: http://incident-service-qa:3017
      LOGGER_SERVICE_URL: http://logger-service-qa:3018
      JWT_SECRET: qa-secret-key-change-in-production
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    networks:
      - uce-qa-network
    depends_on:
      - auth-service-qa
      - reservation-service-qa
      - laboratory-service-qa
      - notification-service-qa
      - catalog-service-qa
      - payment-service-qa
      - incident-service-qa
      - logger-service-qa
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── QA: Frontend (puerto 80) ────────────────────────
  frontend-qa:
    image: ${ECR_REGISTRY:-localhost}/uce-frontend:${IMAGE_TAG:-qa-latest}
    container_name: frontend-qa
    ports:
      - "80:80"
    networks:
      - uce-qa-network
    depends_on:
      - api-gateway-qa
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health.html"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ─── QA: Zookeeper (Requerido por Kafka) ──────────────
  zookeeper-qa:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper-qa
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - uce-qa-network

  # ─── QA: MQTT Broker (Eclipse Mosquitto) ─────────────
  mosquitto-qa:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto-qa
    # Mosquitto MQTT and WebSocket ports are internal-only in QA.
    # Only internal services (catalog-service-qa, notification-service-qa) connect to it.
    networks:
      - uce-qa-network
    command: >
      sh -c "echo 'listener 1883' > /mosquitto/config/mosquitto.conf && 
      echo 'protocol mqtt' >> /mosquitto/config/mosquitto.conf &&
      echo 'listener 9001' >> /mosquitto/config/mosquitto.conf &&
      echo 'protocol websockets' >> /mosquitto/config/mosquitto.conf &&
      echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf && 
      /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"

  # ─── QA: Kafka Broker ─────────────────────────────────
  kafka-qa:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-qa
    # Kafka is internal-only in QA — no host port binding needed.
    depends_on:
      - zookeeper-qa
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-qa:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-qa:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - uce-qa-network

  # ─── QA: Logger Database (MongoDB) ───────────────────
  logger-db-qa:
    image: mongo:6
    container_name: logger-db-qa
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${LOGGER_DB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${LOGGER_DB_PASS:-admin}
    volumes:
      - logger-db-qa-data:/data/db
    networks:
      - uce-qa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── QA: Logger Service (puerto 3018) ────────────────
  logger-service-qa:
    image: ${ECR_REGISTRY:-localhost}/uce-logger-service:${IMAGE_TAG:-qa-latest}
    container_name: logger-service-qa
    pull_policy: always
    environment:
      NODE_ENV: qa
      PORT: 3018
      MONGODB_URI: mongodb://${LOGGER_DB_USER:-admin}:${LOGGER_DB_PASS:-admin}@logger-db-qa:27017/logger_service_qa?authSource=admin
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-qa:5672
    depends_on:
      logger-db-qa:
        condition: service_healthy
      rabbitmq-qa:
        condition: service_healthy
    networks:
      - uce-qa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3018/logs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── QA: n8n Workflow Automation (puerto 5678) ────────
  n8n-qa:
    image: n8nio/n8n:latest
    container_name: n8n-qa
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=true
    volumes:
      - n8n-qa-data:/home/node/.n8n
    networks:
      - uce-qa-network
    restart: unless-stopped

volumes:
  auth-db-qa-data:
  reservation-db-qa-data:
  laboratory-db-qa-data:
  notification-db-qa-data:
  catalog-db-qa-data:
  incident-db-qa-data:
  logger-db-qa-data:
  rabbitmq-qa-data:
  n8n-qa-data:

networks:
  uce-qa-network:
    driver: bridge

# Force full build for new account# Force rebuild for new AWS account
