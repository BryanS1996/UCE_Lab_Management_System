version: '3.9'

services:
  auth-db:
    image: postgres:15-alpine
    container_name: auth-db
    env_file: .env
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpassword
      POSTGRES_DB: auth_service
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - uce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_USERNAME: authuser
      DB_PASSWORD: authpassword
      DB_NAME: auth_service
      JWT_SECRET: your-secret-key-change-in-production
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      auth-db:
        condition: service_healthy
    volumes:
      - ./services/auth-service/src:/app/src
      - ./services/auth-service/node_modules:/app/node_modules
    networks:
      - uce-network

volumes:
  auth-db-data:

networks:
  uce-network:
    driver: bridge