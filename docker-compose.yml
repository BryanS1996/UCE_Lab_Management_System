
services:
  # ─────────────────────────────────────────────────────
  # BASE DE DATOS: Auth Service
  # ─────────────────────────────────────────────────────
  auth-db:
    image: postgres:15-alpine
    container_name: auth-db
    env_file: .env
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpassword
      POSTGRES_DB: auth_service
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - uce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────
  # MICROSERVICIO: Auth Service
  # ─────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_USERNAME: authuser
      DB_PASSWORD: authpassword
      DB_NAME: auth_service
      JWT_SECRET: your-secret-key-change-in-production
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      auth-db:
        condition: service_healthy
    volumes:
      - ./services/auth-service/src:/app/src
      - ./services/auth-service/node_modules:/app/node_modules
    networks:
      - uce-network

  # ─────────────────────────────────────────────────────
  # BASE DE DATOS: Reservation Service
  # ─────────────────────────────────────────────────────
  reservation-db:
    image: postgres:15-alpine
    container_name: reservation-db
    environment:
      POSTGRES_USER: reservationuser
      POSTGRES_PASSWORD: reservationpassword
      POSTGRES_DB: reservation_service
    ports:
      - "5433:5432"
    volumes:
      - reservation-db-data:/var/lib/postgresql/data
    networks:
      - uce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservationuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────
  # MENSAJERÍA ASÍNCRONA: RabbitMQ
  # ─────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - uce-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────────────
  # MICROSERVICIO: Reservation Service
  # ─────────────────────────────────────────────────────
  reservation-service:
    build:
      context: ./services/reservation-service
      dockerfile: Dockerfile
    container_name: reservation-service
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: reservation-db
      DB_PORT: 5432
      DB_USERNAME: reservationuser
      DB_PASSWORD: reservationpassword
      DB_NAME: reservation_service
      DB_SSL: "false"
      JWT_SECRET: your-secret-key-change-in-production
      CORS_ORIGIN: http://localhost:3000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "3001:3001"
    depends_on:
      reservation-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/reservation-service/src:/app/src
      - ./services/reservation-service/node_modules:/app/node_modules
    networks:
      - uce-network
    restart: unless-stopped

volumes:
  auth-db-data:
  reservation-db-data:
  rabbitmq-data:

networks:
  uce-network:
    driver: bridge