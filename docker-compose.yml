
services:
  # ─────────────────────────────────────────────────────
  # DATABASE: Auth Service
  # ─────────────────────────────────────────────────────
  auth-db:
    image: postgres:15-alpine
    container_name: auth-db
    env_file: .env
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpassword
      POSTGRES_DB: auth_service
    ports:
      - "5432:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - uce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────
  # MICROSERVICE: Auth Service
  # ─────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_USERNAME: authuser
      DB_PASSWORD: authpassword
      DB_NAME: auth_service
      JWT_SECRET: your-secret-key-change-in-production
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      auth-db:
        condition: service_healthy
    volumes:
      - ./services/auth-service/src:/app/src
      - ./services/auth-service/node_modules:/app/node_modules
    networks:
      - uce-network

  # ─────────────────────────────────────────────────────
  # DATABASE: Reservation Service
  # ─────────────────────────────────────────────────────
  reservation-db:
    image: postgres:15-alpine
    container_name: reservation-db
    environment:
      POSTGRES_USER: reservationuser
      POSTGRES_PASSWORD: reservationpassword
      POSTGRES_DB: reservation_service
    ports:
      - "5433:5432"
    volumes:
      - reservation-db-data:/var/lib/postgresql/data
    networks:
      - uce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservationuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────
  # ASYNCHRONOUS MESSAGING: RabbitMQ
  # ─────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - uce-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────────────
  # MICROSERVICE: Reservation Service
  # ─────────────────────────────────────────────────────
  reservation-service:
    build:
      context: ./services/reservation-service
      dockerfile: Dockerfile
    container_name: reservation-service
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: reservation-db
      DB_PORT: 5432
      DB_USERNAME: reservationuser
      DB_PASSWORD: reservationpassword
      DB_NAME: reservation_service
      DB_SSL: "false"
      JWT_SECRET: your-secret-key-change-in-production
      CORS_ORIGIN: http://localhost:3000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "3001:3001"
    depends_on:
      reservation-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/reservation-service/src:/app/src
      - ./services/reservation-service/node_modules:/app/node_modules
    networks:
      - uce-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────
  # BASE DE DATOS: Laboratory Service
  # ─────────────────────────────────────────────────────
  laboratory-db:
    image: postgres:15-alpine
    container_name: laboratory-db
    environment:
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: labpassword
      POSTGRES_DB: laboratory_service
    ports:
      - "5436:5432"
    volumes:
      - laboratory-db-data:/var/lib/postgresql/data
    networks:
      - uce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────
  # MICROSERVICIO: Laboratory Service
  # ─────────────────────────────────────────────────────
  laboratory-service:
    build:
      context: ./services/laboratory-service
      dockerfile: Dockerfile
    container_name: laboratory-service
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: laboratory-db
      DB_PORT: 5432
      DB_USERNAME: labuser
      DB_PASSWORD: labpassword
      DB_NAME: laboratory_service
      DB_SSL: "false"
      JWT_SECRET: your-secret-key-change-in-production
      CORS_ORIGIN: "*"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "3002:3002"
    depends_on:
      laboratory-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/laboratory-service/src:/app/src
      - ./services/laboratory-service/node_modules:/app/node_modules
    networks:
      - uce-network
    restart: unless-stopped

  # ─────────────────────────────────────────────────────
  # BASE DE DATOS: Notification Service
  # ─────────────────────────────────────────────────────
  notification-db:
    image: postgres:15-alpine
    container_name: notification-db
    environment:
      POSTGRES_USER: notifuser
      POSTGRES_PASSWORD: notifpassword
      POSTGRES_DB: notification_service
    ports:
      - "5437:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    networks:
      - uce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────
  # MICROSERVICIO: Notification Service
  # ─────────────────────────────────────────────────────
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3003
      DB_HOST: notification-db
      DB_PORT: 5432
      DB_USERNAME: notifuser
      DB_PASSWORD: notifpassword
      DB_NAME: notification_service
      DB_SSL: "false"
      JWT_SECRET: your-secret-key-change-in-production
      CORS_ORIGIN: "*"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "3003:3003"
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/notification-service/src:/app/src
      - ./services/notification-service/node_modules:/app/node_modules
    networks:
      - uce-network
    restart: unless-stopped

volumes:
  auth-db-data:
  reservation-db-data:
  rabbitmq-data:
  laboratory-db-data:
  notification-db-data:

networks:
  uce-network:
    driver: bridge